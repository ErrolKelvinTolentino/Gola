name: gola_goal_guidance_app
description: "Goal planning app with AI-powered task breakdown."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

  # API Calls (Gemini)
  http: ^1.2.0

  # Env
  flutter_dotenv: ^5.1.0

  # (Optional but recommended for JSON safety)
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/images/
    - .env
